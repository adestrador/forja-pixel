name: Publicar Forja Pixel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Gerar páginas
        env:
          SITE_ORIGIN: https://adestrador.github.io/forja-pixel
          SYNC_GITHUB_REPOS: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
